# CI for a static site. The site ships build-less, so this is a
# correctness gate, not a build: it proves every local asset reference
# (/inc/..., /img/...) still resolves before anything reaches `main`. It
# cannot judge whether the page *looks* right — that stays a
# human-in-a-browser check (see CONTRIBUTING). stdlib-only Python;
# nothing to install.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  links:
    name: local asset references resolve
    runs-on: ubuntu-latest
    steps:
      # Third-party actions SHA-pinned, not tag-pinned — a movable tag can ship
      # new code into a trusted build (atelier tools/README.md — "Supply chain").
      # The trailing tag is the label; bump both together, re-resolving the SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check local links
        run: python3 tools/check_links.py
